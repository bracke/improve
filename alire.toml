name = "improve"
description = "Deterministic quality remediation planning for Ada projects"
version = "0.1.0-dev"
licenses = "MIT"
authors = ["Bent Bracke"]
maintainers = ["Bent Bracke <bent@bracke.dk>"]
maintainers-logins = ["bracke"]
website = "https://github.com/bracke/improve"
tags = ["ada", "quality", "planning", "cli"]
project-files = ["improve.gpr"]
executables = ["improve"]

[[depends-on]]
gnat_native = "=15.2.1"

[[depends-on]]
database = "*"

[[depends-on]]
ada_quality = "*"

[[depends-on]]
jsonlib = "*"

[[depends-on]]
messages = "*"

[[depends-on]]
terminal_styles = "*"

[[depends-on]]
project_tools = "*"

[[depends-on]]
hostkit = "*"

[[depends-on]]
model_runner = "*"

[build-profiles]
"*" = "development"

[[actions]]
type = "test"
command = ["gprbuild", "-P", "tools/improve_tools.gpr", "-p", "-j1"]

[[actions]]
type = "test"
command = ["tools/bin/check_phase_9"]

# Local development pins. These are replaced by registry versions in a release manifest.
[[pins]]
ada_quality = { path = "../ada_quality" }
database = { path = "../database" }
jsonlib = { path = "../jsonlib" }
messages = { path = "../messages" }
terminal_styles = { path = "../terminal_styles" }
project_tools = { path = "../project_tools" }
hostkit = { path = "../hostkit" }
model_runner = { path = "../model_runner" }
cryptolib = { path = "../cryptolib" }
i18n = { path = "../i18n" }
regexp = { path = "../regexp" }
httpclient = { path = "../httpclient" }
ssllib = { path = "../ssllib" }
truststores = { path = "../truststores" }
zlib = { path = "../zlib" }
jpeglib = { path = "../jpeglib" }
versionlib = { path = "../versionlib" }
ssh_lib = { path = "../sshlib" }
awklib = { path = "../awklib" }

