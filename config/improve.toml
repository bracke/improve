schema_version = 2

[quality]
database = ".ada-quality.db"
selection = "latest_completed"
maximum_database_projects = 10000
maximum_database_runs = 1000000
maximum_database_findings = 2000000
maximum_database_bytes = 1073741824
maximum_assessment_findings = 10000
maximum_assessment_bytes = 16777216
maximum_normalized_finding_bytes = 16777216
maximum_source_file_bytes = 16777216
maximum_source_total_bytes = 268435456

[planning]
minimum_severity = "low"
maximum_tasks_per_plan = 100
maximum_findings_per_task = 50
allow_investigation_tasks = true
require_review = true
agent_max_context_bytes = 131072
agent_max_file_bytes = 32768
agent_max_response_bytes = 131072
agent_timeout_seconds = 60

[operations]
maximum_recovery_operations = 100
maximum_history_items = 100000
maximum_migration_rows = 1000000
maximum_persisted_text_bytes = 1048576
maximum_persisted_total_bytes = 67108864

[workflow]
task_kind = "auto"
publication = "candidate"
require_initialized_project = true

[verification]
require_fresh_measurement = true
require_same_policy = true
require_same_toolchain = false
require_no_new_critical_findings = true

[output]
format = "terminal"
color = "auto"
maximum_output_items = 10000

