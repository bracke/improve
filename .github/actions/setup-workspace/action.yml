name: Set up pinned Ada workspace
description: Check out exact sibling revisions and restore OS-specific Alire/build caches.

inputs:
  cache-build-artifacts:
    description: Restore compiler outputs; disable for clean-room builds.
    required: false
    default: "true"
  install-release-tools:
    description: Install the pinned GNATdoc and GNATprove binaries used by the release gate.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Check out pinned workspace dependencies
      shell: bash
      run: |
        while IFS='=' read -r repository revision; do
          revision=${revision%$'\r'}
          test -n "$repository"
          test "${#revision}" -eq 40
          mkdir "$repository"
          git -C "$repository" init
          git -C "$repository" remote add origin "https://github.com/bracke/$repository.git"
          git -C "$repository" fetch --depth 1 origin "$revision"
          test "$(git -C "$repository" rev-parse FETCH_HEAD)" = "$revision"
          git -C "$repository" checkout --detach FETCH_HEAD
        done < improve/.github/dependency-lock.txt
    - name: Restore Alire cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          ~/.cache/alire
          ~/.local/share/alire/indexes
          ~/.local/share/alire/releases
        key: improve-${{ runner.os }}-gnat15-alire-${{ hashFiles('improve/.github/dependency-lock.txt') }}
    - name: Restore Ada build cache
      if: inputs.cache-build-artifacts == 'true'
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          *_build
          improve/obj
          improve/tests/obj
          improve/model_runner_runtime/obj
          improve/model_runner_runtime/tests/obj-*
        key: improve-${{ runner.os }}-gnat15-${{ hashFiles('improve/.github/dependency-lock.txt') }}-${{ github.sha }}
        restore-keys: |
          improve-${{ runner.os }}-gnat15-${{ hashFiles('improve/.github/dependency-lock.txt') }}-
    - name: Install pinned Alire toolchain
      uses: alire-project/setup-alire@8398015c233537c928d12293d46c0dcecb54434c # v5
    - name: Install pinned release tools
      if: inputs.install-release-tools == 'true'
      shell: bash
      run: |
        release_tools_prefix="${RUNNER_TEMP}/improve-release-tools"
        alr --non-interactive install --prefix="$release_tools_prefix" \
          gnatdoc_bin=26.0.0 gnatprove=15.1.0
        echo "$release_tools_prefix/bin" >> "$GITHUB_PATH"
