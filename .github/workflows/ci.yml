name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: alire-project/setup-alire@v5
      - run: alr build --validation
      - run: alr test
      - run: alr exec -- gprbuild -P tools/check_all.gpr -p
      - run: tools/bin/check_all
