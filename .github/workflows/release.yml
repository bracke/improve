name: Release candidate

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Release version used for the Git tag and GitHub release
        required: true
        type: string
        default: "0.1.0"
      create_release:
        description: Create the validated Git tag and GitHub release
        required: true
        type: boolean
        default: false
      submit_to_index:
        description: Submit the validated release to the Alire community index
        required: true
        type: boolean
        default: false
      submit_runtime_to_index:
        description: Submit the optional runtime crate after Improve and model_runner releases are indexed
        required: true
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  validate-release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: improve
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          path: improve
      - uses: ./improve/.github/actions/setup-workspace
        with:
          install-release-tools: "true"
      - name: Generate Alire configuration projects
        run: alr build --validation --stop-after=generation
      - name: Build release tools
        run: alr exec -- gprbuild -P tools/improve_tools.gpr -p -j1
      - name: Run Phase 9
        run: tools/bin/check_phase_9
      - name: Validate pin-free release candidate
        run: tools/bin/check_release_candidate
      - name: Capture generated CLI assets
        run: |
          ./bin/improve manpage > improve.1
          ./bin/improve completion bash > improve.bash
          ./bin/improve completion zsh > _improve
          ./bin/improve completion fish > improve.fish
      - name: Generate SPDX software bill of materials
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: improve
          format: spdx-json
          output-file: improve/improve.spdx.json
      - name: Attest executable build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            improve/bin/improve
            improve/model_runner_runtime/bin/improve-model-runner
      - name: Attest the generated SBOM
        uses: actions/attest-sbom@bd218ad0dbcb3e146bd073d1d9c6d78e08aa8a0b # v2
        with:
          subject-path: improve/bin/improve
          sbom-path: improve/improve.spdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: improve-${{ github.ref_name }}-cli-assets
          path: |
            improve/improve.1
            improve/improve.bash
            improve/_improve
            improve/improve.fish
            improve/schemas/improve-output-v1.schema.json
            improve/model_runner_runtime/bin/improve-model-runner
            improve/model_runner_runtime/alire.release.toml
            improve/improve.spdx.json
            improve/docs/model-supply-chain.md
      - name: Create Git tag and GitHub release
        if: github.event_name == 'workflow_dispatch' && inputs.create_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "v${{ inputs.release_version }}"
          --target "${GITHUB_SHA}" --generate-notes
      - name: Submit to Alire community index
        if: github.event_name == 'workflow_dispatch' && inputs.submit_to_index
        env:
          GH_TOKEN: ${{ secrets.ALIRE_GITHUB_TOKEN }}
        run: >-
          alr -n publish --manifest alire.release.toml
          "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" "${GITHUB_SHA}"
      - name: Submit optional runtime to Alire community index
        if: github.event_name == 'workflow_dispatch' && inputs.submit_runtime_to_index
        env:
          GH_TOKEN: ${{ secrets.ALIRE_GITHUB_TOKEN }}
        run: >-
          alr -n publish --manifest model_runner_runtime/alire.release.toml
          "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" "${GITHUB_SHA}"
